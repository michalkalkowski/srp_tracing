name: srp_tomo
channels: !!python/tuple
- conda-forge
- defaults
dependencies:
- conda-forge::ipython
- conda-forge::jupyter
- conda-forge::matplotlib
- conda-forge::python
- conda-forge::setuptools
- conda-forge::numpy
- conda-forge::scipy
- conda-forge::h5py
- conda-forge::shapely
- conda-forge::tqdm
- pip
- pip:
  # Sibling, unpublished packages providing the grain-orientation models
  # used by examples/ and tests/test_*_validation.py. Paths are relative
  # to the directory `conda env create -f environment.yml` is run from
  # (this repo's root), and assume the sibling layout this repo has always
  # used: srp_tracing/, ogilvy_weld/, mina_weld/, and gen_ogilvy/ under the
  # same parent directory.
  - -e ../ogilvy_weld
  - -e ../mina_weld
  # gen_ogilvy.multi_weld.MultiVWeld/WeldLevel: the multi-level (double/
  # triple-V) generalisation of ogilvy_weld's single-chamfer model, used
  # by examples/test_ogilvy_triple_v.py.
  - -e ../gen_ogilvy

